name: release-testing

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'a release tag that will be created upon success (e.g. v1.2.3 or v1.2.3-rc.1)'
        required: true
        type: string

permissions:
  contents: read

jobs:

  # --------------------------------------------------------------------------
  # Input Validation
  # --------------------------------------------------------------------------

  # Validate the tag input up front so that a malformed (or malicious) value
  # fails fast, before any test job consumes secrets. The input is passed via
  # an environment variable rather than interpolated with ${{ }} directly into
  # the script, to prevent shell script injection.
  validate-tag:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
    - name: validate tag input
      env:
        TAG: ${{ inputs.tag }}
      run: |
        if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
          echo "::error::Invalid tag '${TAG}'. Expected format vMAJOR.MINOR.PATCH[-PRERELEASE]."
          exit 1
        fi

  # --------------------------------------------------------------------------
  # Release Testing Job
  # --------------------------------------------------------------------------

  unit-tests:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    needs:
    - validate-tag
    steps:

    - name: checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0

    - name: setup golang
      uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
      with:
        go-version-file: go.mod

    - name: run unit tests
      run: make test.unit

  setup-integration-tests:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    needs:
    - validate-tag
    outputs:
      test_names: ${{ steps.set_test_names.outputs.test_names }}
    steps:

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - id: set_test_names
      name: Set test names
      working-directory: test/integration/
      # grep magic described in https://unix.stackexchange.com/a/13472
      # sed to add the extra $ is because some of our test names overlap. we need it so the -run regex only matches one test
      run: |
        echo "test_names=$(grep -shoP "(?<=^func )(Test[a-zA-Z_0-9]+)(?=\(t \*testing.T\) {)" * | sed -e "s/$/\$/"| jq -R . | jq -cs .)" >> $GITHUB_OUTPUT

    - name: Print test names
      env:
        TEST_NAMES: ${{ steps.set_test_names.outputs.test_names }}
      run: echo "Test names ${TEST_NAMES}"

  integration-tests:
    runs-on: ubuntu-latest
    needs:
    - setup-integration-tests
    strategy:
      fail-fast: false
      matrix:
        test: ${{ fromJSON(needs.setup-integration-tests.outputs.test_names) }}
    steps:

    - uses: Kong/kong-license@62d5e200998d4b19ed6b78591332a092536c63f5 # master @ 20260330
      id: license
      with:
        op-token: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}

    - name: checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0

    - name: setup golang
      uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
      with:
        go-version-file: go.mod

    - name: run integration tests
      run: make test.integration
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        KTF_TEST_KONG_PULL_USERNAME: ${{ secrets.GHA_DOCKERHUB_PULL_USER }}
        KTF_TEST_KONG_PULL_PASSWORD: ${{ secrets.GHA_KONG_ORG_DOCKERHUB_PUBLIC_TOKEN }}
        KONG_LICENSE_DATA: ${{ steps.license.outputs.license }}
        TEST_RUN: ${{ matrix.test }}

  e2e-tests:
    timeout-minutes: 30 # Setting up a GKE cluster and getting a LB ready can take more than the default 10m.
    environment: gcloud
    runs-on: ubuntu-latest
    needs:
    - validate-tag
    steps:

    - uses: Kong/kong-license@62d5e200998d4b19ed6b78591332a092536c63f5 # master @ 20260330
      id: license
      with:
        op-token: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}

    # --------------------------------------------------------------------------
    # Repository Checkout
    # --------------------------------------------------------------------------

    - name: checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0

    - name: setup golang
      uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
      with:
        go-version-file: go.mod

    - name: run e2e tests
      run: make test.e2e
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GOOGLE_APPLICATION_CREDENTIALS: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}
        GOOGLE_PROJECT: ${{ secrets.GOOGLE_PROJECT }}
        GOOGLE_LOCATION: ${{ secrets.GOOGLE_LOCATION }}
        KONG_LICENSE_DATA: ${{ steps.license.outputs.license }}

  release-tagging:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    needs:
    - validate-tag
    - unit-tests
    - integration-tests
    - e2e-tests
    permissions:
      contents: write
    steps:

    - name: checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        # This is needed to trigger another workflow, specifically release workflow
        # which listens to pushing "v*" tags.
        # > When you use the repository’s GITHUB_TOKEN to perform tasks on behalf
        # > of the GitHub Actions app, events triggered by the GITHUB_TOKEN will not
        # > create a new workflow run.
        # ref: https://docs.github.com/en/actions/security-guides/automatic-token-authentication#using-the-github_token-in-a-workflow
        token: ${{ secrets.PAT_GITHUB }}

    # --------------------------------------------------------------------------
    # Release Tagging
    # --------------------------------------------------------------------------

    # The tag is passed via an environment variable (never interpolated with
    # ${{ }} into the script) and re-validated here, since this job holds a
    # write-scoped PAT and should not rely solely on the validate-tag job.
    - name: set the release tag and push it
      env:
        TAG: ${{ inputs.tag }}
      run: |
        if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
          echo "::error::Invalid tag '${TAG}'. Expected format vMAJOR.MINOR.PATCH[-PRERELEASE]."
          exit 1
        fi
        git tag -- "${TAG}"
        git push origin "refs/tags/${TAG}"
